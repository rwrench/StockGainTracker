name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows-maui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui-windows
      - run: dotnet build StockGainTracker.MauiApp/StockGainTracker.MauiApp.csproj -f net10.0-windows10.0.19041.0

  android-maui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install android maui-android
      - run: dotnet build StockGainTracker.MauiApp/StockGainTracker.MauiApp.csproj -f net10.0-android

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build StockGainTracker/StockGainTracker.csproj